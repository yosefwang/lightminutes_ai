version: '3.8'

services:
  # LightMinute AI - Next.js Full Stack Application
  app:
    image: yosefwang/lightminute-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lightminute-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Load environment variables from .env file
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist uploaded audio files
      - app-uploads:/app/uploads
      # Persist database data
      - app-data:/app/data
    networks:
      - lightminute-network

# Volumes for persistent data
volumes:
  app-uploads:
    name: lightminute-uploads
  app-data:
    name: lightminute-data

# Internal network
networks:
  lightminute-network:
    name: lightminute-network
    driver: bridge
