version: '3.8'

services:
  # Backend service
  backend:
    image: yosefwang/lightminutes_backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lightminute-backend
    restart: unless-stopped
    ports:
      - "8787:8787"
    # Load environment variables from server/.env
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist uploaded audio files
      - backend-uploads:/app/uploads
      # Persist database data
      - backend-data:/app/data
    networks:
      - lightminute-network

  # Frontend service
  frontend:
    image: yosefwang/lightminutes_frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      # Pass environment variables from client/.env for build time
      args:
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY:-}
    container_name: lightminute-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lightminute-network

# Volumes for persistent data
volumes:
  backend-uploads:
    name: lightminute-uploads
  backend-data:
    name: lightminute-data

# Internal network
networks:
  lightminute-network:
    name: lightminute-network
    driver: bridge
